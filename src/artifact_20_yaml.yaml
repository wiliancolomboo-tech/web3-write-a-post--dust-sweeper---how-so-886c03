version: '3.8'

services:
  sweeper-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solana-dust-sweeper
    restart: unless-stopped
    environment:
      - PROGRAM_ID=DustSwp111111111111111111111111111111111111
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ALERT_EMAIL_RECIPIENT=${ALERT_EMAIL_RECIPIENT}
    volumes:
      - ./keys:/usr/src/app/keys:ro
    command: ["sweep", "-k", "/usr/src/app/keys/wallet.json", "-r", "https://api.devnet.solana.com"]