version: "3.8"

services:
  dust-sweeper-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - RESEND_API_KEY=re_test_000000000000000000000000
      - NOTIFICATION_EMAIL=alerts@solana-ecosystem.io
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - ORACLE_SECRET_KEY=[1,2,3...]
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M