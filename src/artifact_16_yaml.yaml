version: '3.8'

services:
  solana-dust-sweeper:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=DustSwp111111111111111111111111111111111111
      - PRIVATE_KEY=[1,2,3...your_keypair]
      - ORACLE_PRIVATE_KEY=[4,5,6...oracle_keypair]
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"