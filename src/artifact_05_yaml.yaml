version: "3.8"

services:
  solsweep-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solsweep_engine
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - RPC_ENDPOINT=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=Swp1111111111111111111111111111111111111111
      - DUST_THRESHOLD_LAMPORTS=1000000
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - PAYER_KEYPAIR_PATH=/secrets/payer.json
      - ORACLE_KEYPAIR_PATH=/secrets/oracle.json
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3