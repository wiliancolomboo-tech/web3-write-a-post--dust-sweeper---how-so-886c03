[package]
name = "solsweep"
version = "0.1.0"
description = "SolSweep Protocol: Rent Reclaimer, Dust Burner, and Social Quest XP Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solsweep"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi-context = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
solana-program = "1.18.26"