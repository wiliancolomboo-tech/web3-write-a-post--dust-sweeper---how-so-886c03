version: "3.8"

services:
  sweeper-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solana_dust_sweeper_worker
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - WALLET_PATH=/secrets/payer.json
      - ORACLE_PATH=/secrets/oracle.json
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_test_000000000000000000000000
      - USER_ALERT_EMAIL=ops@sweeperprotocol.io
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3